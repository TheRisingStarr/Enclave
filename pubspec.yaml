
name: enclave
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  material_ui: ^1.9.0
  material_3_expressive: ^1.2.0
  kdbx: ^2.5.0
  file_picker: ^13.3.2
  path_provider: ^2.1.6
  android_file_picker: ^2.1.3
  shared_preferences: ^2.5.6
  saf_stream: ^4.0.3
  totp: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png

  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
